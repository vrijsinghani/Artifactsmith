[project]
name = "artifactsmith"
version = "0.1.0"
description = "A self-hosted MCP server that lets AI agents make real documents: web pages, PDFs, Word docs, Excel sheets, and Markdown, with private previews and share links you can turn off."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
authors = [{ name = "ArtifactSmith contributors" }]
keywords = ["mcp", "artifacts", "self-hosted"]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Typing :: Typed",
]
dependencies = [
    "mcp>=1.26,<2",
    "uvicorn>=0.30",
    "boto3>=1.34",
    "httpx>=0.27",
    "weasyprint>=62,<71",
    "python-docx>=1.1,<2",
    "openpyxl>=3.1,<4",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.8",
    "mypy>=1.13",
    "pytest>=8",
    "pytest-cov>=6",
    "pytest-asyncio>=0.24",
    "pre-commit>=4",
    "types-openpyxl>=3.1",
    "pip-audit>=2.7",
]

[project.scripts]
artifactsmith = "artifactsmith.cli:main"

[project.urls]
Homepage = "https://github.com/vrijsinghani/artifactsmith"
Issues = "https://github.com/vrijsinghani/artifactsmith/issues"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
artifactsmith = ["py.typed"]

[tool.ruff]
target-version = "py311"
line-length = 120
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B011"]

[tool.mypy]
python_version = "3.11"
packages = ["artifactsmith"]
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true
check_untyped_defs = true
disallow_incomplete_defs = true
pretty = true

[[tool.mypy.overrides]]
module = ["weasyprint", "docx", "docx.*", "mcp", "mcp.*", "boto3", "botocore.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = [
    "artifactsmith.service",
    "artifactsmith.db",
    "artifactsmith.store",
    "artifactsmith.llm",
    "artifactsmith.config",
    "artifactsmith.builder",
    "artifactsmith.mock_llm",
]
disallow_incomplete_defs = false
check_untyped_defs = false

[tool.pytest.ini_options]
testpaths = ["tests/unit"]
addopts = "-q --cov=artifactsmith --cov-report=term-missing --cov-fail-under=45"
asyncio_mode = "auto"

[tool.coverage.run]
source = ["src/artifactsmith"]
omit = ["src/artifactsmith/__main__.py"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
]

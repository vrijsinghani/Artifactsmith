name: artifactsmith

# Local object-store credentials for this stack. Generated locally; deliberately NOT the well-known admin pair.
x-store: &store-env
  AM_STORE_ENDPOINT: http://storage:9000
  AM_STORE_KEY: am-local-access-key
  AM_STORE_SECRET: am-local-secret-key-not-the-default-pair
  AM_STORE_BUCKET: artifacts

services:
  storage:
    image: rustfs/rustfs:latest
    # Internal only: no published ports. The object store is reachable only on the compose network.
    environment:
      RUSTFS_ACCESS_KEY: am-local-access-key
      RUSTFS_SECRET_KEY: am-local-secret-key-not-the-default-pair
      RUSTFS_CONSOLE_ENABLE: "false"
    volumes:
      - rustfs-data:/data
    networks: [am]
    restart: unless-stopped

  storage-init:
    build:
      context: .
      dockerfile: docker/Dockerfile
    command: ["artifactsmith", "storage-init"]
    environment: *store-env
    depends_on:
      storage:
        condition: service_started
    restart: "no"
    networks: [am]

  server:
    build:
      context: .
      dockerfile: docker/Dockerfile
    ports:
      - "127.0.0.1:8780:8780"   # MCP API (bearer auth)
      - "127.0.0.1:8781:8781"   # cookieless preview / share origin
    environment:
      <<: *store-env
      AM_LLM_API: chat
      AM_LLM_BASE: http://mock-llm:8080
      AM_DEFAULT_MODEL: mock-echo
      AM_SHARE_TTL_DAYS: "30"
      AM_SHARE_TTL_MAX_DAYS: "365"
      AM_BLOCK_PRIVATE_LINKS: "true"
      AM_ALLOWED_LINK_DOMAINS: ""
    volumes:
      - am-data:/data
      - am-secrets:/secrets
    depends_on:
      storage:
        condition: service_started
      storage-init:
        condition: service_completed_successfully
    networks: [am]

  # Canned OpenAI Chat Completions replies so the flow runs with no real API key.
  mock-llm:
    profiles: [test]
    build:
      context: .
      dockerfile: docker/Dockerfile
    command: ["artifactsmith", "mock-llm"]
    networks: [am]

volumes:
  rustfs-data:
  am-data:
  am-secrets:

networks:
  am:

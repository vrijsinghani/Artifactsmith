name: artifactsmith

# Object-store credentials come from .env (see .env.example and scripts/ensure-local-env.sh).
x-store: &store-env
  AM_STORE_ENDPOINT: ${AM_STORE_ENDPOINT:-http://storage:9000}
  AM_STORE_KEY: ${AM_STORE_KEY:?Set AM_STORE_KEY in .env (run ./scripts/ensure-local-env.sh)}
  AM_STORE_SECRET: ${AM_STORE_SECRET:?Set AM_STORE_SECRET in .env (run ./scripts/ensure-local-env.sh)}
  AM_STORE_BUCKET: ${AM_STORE_BUCKET:-artifacts}

services:
  storage:
    # rustfs/rustfs:1.0.1
    image: rustfs/rustfs@sha256:1803faef57627e2d9c2e7d89d655d712ddded5389040054987163043fecb6a3c
    # Internal only: no published ports. The object store is reachable only on the compose network.
    environment:
      RUSTFS_ACCESS_KEY: ${AM_STORE_KEY:?Set AM_STORE_KEY in .env (run ./scripts/ensure-local-env.sh)}
      RUSTFS_SECRET_KEY: ${AM_STORE_SECRET:?Set AM_STORE_SECRET in .env (run ./scripts/ensure-local-env.sh)}
      RUSTFS_CONSOLE_ENABLE: "false"
    volumes:
      - rustfs-data:/data
    networks: [am]
    restart: unless-stopped

  storage-init:
    build:
      context: .
      dockerfile: docker/Dockerfile
    command: ["artifactsmith", "storage-init"]
    env_file:
      - .env
    environment: *store-env
    depends_on:
      storage:
        condition: service_started
    restart: "no"
    networks: [am]

  server:
    build:
      context: .
      dockerfile: docker/Dockerfile
    ports:
      - "127.0.0.1:8780:8780"   # MCP API (bearer auth)
      - "127.0.0.1:8781:8781"   # cookieless preview / share origin
    # Bring every documented setting (AM_SHARE_URL, AM_MAX_BUILDS, *_FILE, …) from .env.
    # Explicit environment entries below override when set; they supply defaults for LLM/store.
    env_file:
      - .env
    environment:
      <<: *store-env
      AM_LLM_API: ${AM_LLM_API:-chat}
      AM_LLM_BASE: ${AM_LLM_BASE:-https://api.openai.com}
      AM_LLM_KEY: ${AM_LLM_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      AM_DEFAULT_MODEL: ${AM_DEFAULT_MODEL:-gpt-4o-mini}
      AM_SHARE_TTL_DAYS: ${AM_SHARE_TTL_DAYS:-30}
      AM_SHARE_TTL_MAX_DAYS: ${AM_SHARE_TTL_MAX_DAYS:-365}
      AM_BLOCK_PRIVATE_LINKS: ${AM_BLOCK_PRIVATE_LINKS:-true}
      AM_ALLOWED_LINK_DOMAINS: ${AM_ALLOWED_LINK_DOMAINS:-}
    volumes:
      - am-data:/data
      - am-secrets:/secrets
    depends_on:
      storage:
        condition: service_started
      storage-init:
        condition: service_completed_successfully
    networks: [am]

volumes:
  rustfs-data:
  am-data:
  am-secrets:

networks:
  am:

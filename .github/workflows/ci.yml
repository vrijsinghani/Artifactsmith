name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONUNBUFFERED: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  lint-typecheck:
    name: lint and types
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d3955d4b3dfd4e07dfee8328 # v5.6.0
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install -U pip
          pip install -e ".[dev]"
      - name: Ruff
        run: |
          ruff check src tests examples
          ruff format --check src tests examples
      - name: Mypy
        run: mypy
      - name: Denylist
        run: bash scripts/denylist.sh

  test:
    name: unit tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d3955d4b3dfd4e07dfee8328 # v5.6.0
        with:
          python-version: "3.12"
      - name: WeasyPrint system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libpango-1.0-0 libpangocairo-1.0-0 libpangoft2-1.0-0 \
            libgdk-pixbuf-2.0-0 libffi8 libjpeg-turbo8 libopenjp2-7 \
            shared-mime-info fonts-liberation
      - name: Install
        run: |
          python -m pip install -U pip
          pip install -e ".[dev]"
      - name: Pytest
        run: pytest --cov=artifactsmith --cov-report=term-missing --cov-report=xml --cov-fail-under=45
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: coverage-xml
          path: coverage.xml

  docker:
    name: docker image
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: docker/setup-buildx-action@b5ca514318bd6ebac0fb2aedd5d36ec1e5c910d7 # v3.10.0
      - name: Build image
        uses: docker/build-push-action@471d1dc4e07e5cdedd4c2171150001c43438b4ae # v6.15.0
        with:
          context: .
          file: docker/Dockerfile
          push: false
          tags: artifactsmith:ci
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

  scan:
    name: dependency scan
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d3955d4b3dfd4e07dfee8328 # v5.6.0
        with:
          python-version: "3.12"
      - name: pip-audit
        run: |
          python -m pip install -U pip pip-audit
          pip install -e .
          pip-audit --desc
      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@18f2510ee396bbf400402947b394f2dd8c87dbb0 # v0.29.0
        with:
          scan-type: fs
          scan-ref: .
          severity: CRITICAL
          exit-code: "1"
          ignore-unfixed: true

  smoke:
    name: compose smoke
    runs-on: ubuntu-24.04
    needs: [lint-typecheck, test]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d3955d4b3dfd4e07dfee8328 # v5.6.0
        with:
          python-version: "3.12"
      - name: Install client extras
        run: |
          python -m pip install -U pip
          pip install -e ".[dev]"
      - name: Start stack (mock LLM, no secrets)
        run: docker compose --profile test up -d --build
      - name: Checkpoint smoke
        run: python tests/smoke/test_checkpoint1.py
      - name: Format smoke
        run: python tests/smoke/test_formats.py
      - name: Compose logs on failure
        if: failure()
        run: docker compose --profile test logs --no-color | tail -n 200
      - name: Tear down
        if: always()
        run: docker compose --profile test down -v

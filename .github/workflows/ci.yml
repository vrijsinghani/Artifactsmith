name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONUNBUFFERED: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  lint-typecheck:
    name: lint and types
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install -U pip
          pip install -e ".[dev]"
      - name: Ruff
        run: |
          ruff check src tests examples
          ruff format --check src tests examples
      - name: Mypy
        run: mypy --strict src
      - name: Denylist
        run: bash scripts/denylist.sh

  test:
    name: unit tests (py${{ matrix.python-version }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: WeasyPrint system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libpango-1.0-0 libpangocairo-1.0-0 libpangoft2-1.0-0 \
            libgdk-pixbuf-2.0-0 libffi8 libjpeg-turbo8 libopenjp2-7 \
            shared-mime-info fonts-liberation
      - name: Install
        run: |
          python -m pip install -U pip
          pip install -e ".[dev]"
      - name: Pytest
        run: pytest --cov=artifactsmith --cov-report=term-missing --cov-report=xml --cov-fail-under=80
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: coverage-xml-py${{ matrix.python-version }}
          path: coverage.xml

  docker:
    name: docker image
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/Dockerfile
          push: false
          tags: artifactsmith:ci
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

  scan:
    name: dependency scan
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: pip-audit
        run: |
          python -m pip install -U pip pip-audit
          pip install -e .
          pip-audit --desc
      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          severity: CRITICAL
          exit-code: "1"
          ignore-unfixed: true

  smoke:
    name: compose smoke
    runs-on: ubuntu-24.04
    needs: [lint-typecheck, test]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install client extras
        run: |
          python -m pip install -U pip
          pip install -e ".[dev]"
      - name: Local object-store credentials
        run: bash scripts/ensure-local-env.sh
      - name: Verify .env reaches server via compose config
        run: bash scripts/check-compose-env.sh
      - name: Start test stack
        run: docker compose -f compose.yaml -f compose.test.yaml up -d --build
      - name: End-to-end smoke
        run: python -m tests.e2e.test_end_to_end
      - name: Format smoke
        run: python -m tests.e2e.test_formats
      - name: Compose logs on failure
        if: failure()
        run: docker compose -f compose.yaml -f compose.test.yaml logs --no-color | tail -n 200
      - name: Tear down
        if: always()
        run: docker compose -f compose.yaml -f compose.test.yaml down -v

  bind-smoke:
    name: bind address smoke
    runs-on: ubuntu-24.04
    needs: [lint-typecheck, test]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install client extras
        run: |
          python -m pip install -U pip
          pip install -e ".[dev]"
      - name: Local object-store credentials
        run: bash scripts/ensure-local-env.sh
      - name: Bind-address smoke (0.0.0.0 + public URLs)
        run: python -m tests.e2e.test_bind_address
      - name: Compose logs on failure
        if: failure()
        run: docker compose -f compose.yaml -f compose.test.yaml logs --no-color | tail -n 200
      - name: Tear down
        if: always()
        run: docker compose -f compose.yaml -f compose.test.yaml down -v
